services:
  - type: web
    name: tr-motors-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://bgreeshmanthreddy.github.io
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
